<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta | BemVida+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho-publico">
    <a href="index.html" class="logo"><img src="img/logo.png" alt="BemVida+"> BemVida+</a>
    <nav class="nav-publica">
      <a href="index.html">Início</a>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="campanhas.html">Campanhas</a>
    </nav>
    <div class="acoes-cabecalho">
      <a href="login.html" class="botao botao-secundario">Login</a>
      <a href="cadastro.html" class="botao botao-escuro">Cadastro</a>
    </div>
  </header>

  <section class="pagina-auth">
    <div class="cartao-auth" style="max-width: 460px;">

      <img src="img/logo.png" alt="BemVida+" class="icone-auth">

      <h1>Criar conta</h1>
      <p class="subtitulo-auth">Preencha os dados abaixo.</p>

      <!-- Protótipo estático: leva direto para a Área Doador,
           simulando um cadastro concluído. -->
      <form action="doador/area.html">
        <div class="campo-formulario">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="[ nome completo ]">
        </div>

        <div class="campo-formulario">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="[ CPF ]">
        </div>

        <div class="campo-formulario">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="[ e-mail ]">
        </div>

        <div class="campo-formulario">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="[ telefone ]">
        </div>

        <div class="campo-formulario">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="[ senha ]">
        </div>

        <div class="campo-formulario">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" placeholder="[ confirmar senha ]">
        </div>

        <button type="submit" class="botao botao-primario botao-bloco">Criar conta</button>
      </form>

      <p class="rodape-auth">Já possui conta? <a href="login.html">Faça login</a></p>
      <p class="rodape-auth" style="margin-top:8px;">Representa uma ONG? <a href="cadastro-ong.html">Cadastre sua ONG</a></p>
    </div>
  </section>

  <footer class="rodape">
    [ links institucionais · contato · termos ]
  </footer>

</body>
</html>
