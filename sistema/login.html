<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | BemVida+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho-publico">
    <a href="index.html" class="logo"><img src="img/logo.png" alt="BemVida+"> BemVida+</a>
    <nav class="nav-publica">
      <a href="index.html">Início</a>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="campanhas.html">Campanhas</a>
    </nav>
    <div class="acoes-cabecalho">
      <a href="login.html" class="botao botao-secundario">Login</a>
      <a href="cadastro.html" class="botao botao-escuro">Cadastro</a>
    </div>
  </header>

  <section class="pagina-auth">
    <div class="cartao-auth">

      <!-- Ícone de marca: substitui o círculo cinza genérico do wireframe -->
      <img src="img/logo.png" alt="BemVida+" class="icone-auth">

      <h1>Entrar na sua conta</h1>
      <p class="subtitulo-auth">Acesse para acompanhar suas doações.</p>

      <!-- Protótipo estático: o formulário não autentica de verdade,
           só demonstra a navegação até a Área Doador. -->
      <form action="doador/area.html">
        <div class="campo-formulario">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="[ e-mail ]">
        </div>

        <div class="campo-formulario">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="[ senha ]">
        </div>

        <button type="submit" class="botao botao-primario botao-bloco">Entrar</button>
        <a href="#" class="botao botao-secundario botao-bloco" style="display:block;">Esqueci minha senha</a>
      </form>

      <p class="rodape-auth">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      <p class="rodape-auth" style="margin-top:8px;">É uma ONG? <a href="login-ong.html">Acesse aqui</a></p>
    </div>
  </section>

  <footer class="rodape">
    [ links institucionais · contato · termos ]
  </footer>

</body>
</html>
