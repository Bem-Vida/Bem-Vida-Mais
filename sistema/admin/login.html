<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso do Administrador | BemVida+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="cabecalho-publico">
    <a href="../index.html" class="logo"><img src="../img/logo.png" alt="BemVida+"> BemVida+</a>
    <nav class="nav-publica">
      <a href="../index.html">Início</a>
      <a href="../quem-somos.html">Quem Somos</a>
      <a href="../campanhas.html">Campanhas</a>
    </nav>
    <div class="acoes-cabecalho">
      <a href="../login.html" class="botao botao-secundario">Login</a>
      <a href="../cadastro.html" class="botao botao-escuro">Cadastro</a>
    </div>
  </header>

  <section class="pagina-auth">
    <div class="cartao-auth">
      <img src="../img/logo.png" alt="BemVida+" class="icone-auth">
      <span class="eyebrow">ADMINISTRADOR</span>
      <h1>Acesso restrito</h1>
      <p class="subtitulo-auth">Área exclusiva para a equipe de administração.</p>

      <!-- Protótipo: o formulário não autentica, só leva ao Painel. -->
      <form action="area.html">
        <div class="campo-formulario">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="admin@bemvida.org">
        </div>
        <div class="campo-formulario">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="senha">
        </div>
        <p style="text-align:right; margin:-8px 0 16px;"><a href="#" class="link-sair">Esqueci minha senha</a></p>
        <button type="submit" class="botao botao-primario botao-bloco">Entrar</button>
      </form>

      <p class="rodape-auth"><a href="../index.html">Voltar ao site</a></p>
    </div>
  </section>

  <footer class="rodape">
    [ links institucionais · contato · termos ]
  </footer>

</body>
</html>
