<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar ONGs | BemVida+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="layout-logado">

    <aside class="sidebar">
      <a href="../index.html" class="logo"><img src="../img/logo.png" alt="BemVida+"> BemVida+</a>
      <span class="rotulo-perfil">ADMINISTRADOR</span>
      <nav class="menu-lateral">
        <a href="area.html">Painel</a>
        <a href="validar-ongs.html" class="ativo">Validar ONGs</a>
        <a href="gerenciar-usuarios.html">Gerenciar Usuários</a>
        <a href="moderacao-campanhas.html">Moderação de Campanhas</a>
        <a href="../index.html">Sair</a>
      </nav>
    </aside>

    <main class="conteudo-principal">

      <div class="cabecalho-area">
        <div>
          <span class="eyebrow">ADMINISTRADOR</span>
          <h1 style="font-size:1.4rem; margin-bottom:0;">Validar ONGs</h1>
        </div>
        <div class="info-usuario">
          <span style="color: var(--texto-secundario); font-size: 0.9rem;">Administrador</span>
          <div class="avatar-circulo"></div>
        </div>
      </div>

      <div class="grade-resumo">
        <div class="card card-resumo">
          <span class="eyebrow">PENDENTES</span>
          <div class="valor" id="r-pend"></div>
        </div>
        <div class="card card-resumo">
          <span class="eyebrow">APROVADAS</span>
          <div class="valor" id="r-aprov"></div>
        </div>
        <div class="card card-resumo">
          <span class="eyebrow">RECUSADAS</span>
          <div class="valor" id="r-recus"></div>
        </div>
      </div>

      <div class="card barra-ferramentas">
        <div class="campo-formulario busca">
          <input type="text" id="busca" placeholder="buscar por nome ou CNPJ...">
        </div>
        <div class="campo-formulario">
          <select id="filtro-status">
            <option value="todos">Todos</option>
            <option>Pendente</option>
            <option>Aprovada</option>
            <option>Recusada</option>
          </select>
        </div>
      </div>

      <div class="tabela-wrap">
        <table class="tabela">
          <thead>
            <tr><th>ONG</th><th>CNPJ</th><th>E-MAIL</th><th>DATA DO CADASTRO</th><th>STATUS</th><th>AÇÃO</th></tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>

      <!-- Detalhe da ONG -->
      <dialog class="modal modal-largo" id="modal-detalhe">
        <span class="eyebrow">ANÁLISE DE CADASTRO</span>
        <h3 id="d-nome"></h3>
        <dl class="dados-detalhe" id="d-dados"></dl>
        <span class="eyebrow">DOCUMENTOS ENVIADOS</span>
        <div class="lista-documentos" id="d-docs"></div>
        <p id="d-motivo" class="nota-rodape"></p>
        <div class="botoes-modal">
          <button type="button" class="botao botao-secundario" id="d-fechar">Fechar</button>
          <button type="button" class="botao botao-secundario" id="d-recusar" style="border:1px solid var(--coral-destaque); color:var(--coral-destaque);">Recusar ONG</button>
          <button type="button" class="botao botao-primario" id="d-aprovar" style="border:none;">Aprovar ONG</button>
        </div>
      </dialog>

      <!-- Janela de motivo (usada para recusar, suspender e remover) -->
      <dialog class="modal" id="modal-motivo">
        <h3 id="motivo-titulo"></h3>
        <p id="motivo-texto"></p>
        <div class="campo-formulario">
          <label for="motivo-campo">Motivo (obrigatório)</label>
          <textarea id="motivo-campo" rows="3" placeholder="Explique o motivo da decisão"></textarea>
          <div class="erro-campo" id="motivo-erro">Informe o motivo.</div>
        </div>
        <div class="botoes-modal">
          <button type="button" class="botao botao-secundario" id="motivo-voltar">Voltar</button>
          <button type="button" class="botao botao-escuro" id="motivo-confirmar" style="border:none;"></button>
        </div>
      </dialog>

    </main>
  </div>

  <script src="../js/dados.js"></script>
  <script>
    var ongs = carregarEstado('bemvida_ongs_admin', ONGS_ADMIN_INICIAL);
    var ongAberta = null;
    var modalDetalhe = document.getElementById('modal-detalhe');

    // Abre a janela de motivo. "aoConfirmar" recebe o texto digitado.
    var aoConfirmarMotivo = null;
    var modalMotivo = document.getElementById('modal-motivo');
    function pedirMotivo(titulo, texto, rotuloBotao, aoConfirmar) {
      document.getElementById('motivo-titulo').textContent = titulo;
      document.getElementById('motivo-texto').textContent = texto;
      document.getElementById('motivo-confirmar').textContent = rotuloBotao;
      document.getElementById('motivo-campo').value = '';
      document.getElementById('motivo-erro').style.display = 'none';
      aoConfirmarMotivo = aoConfirmar;
      modalMotivo.showModal();
    }
    document.getElementById('motivo-voltar').addEventListener('click', function () { modalMotivo.close(); });
    document.getElementById('motivo-confirmar').addEventListener('click', function () {
      var motivo = document.getElementById('motivo-campo').value.trim();
      if (motivo === '') {
        document.getElementById('motivo-erro').style.display = 'block';
        return;
      }
      modalMotivo.close();
      aoConfirmarMotivo(motivo);
    });

    function desenhar() {
      var pend = 0, aprov = 0, recus = 0;
      ongs.forEach(function (o) {
        if (o.status === 'Pendente') pend++;
        if (o.status === 'Aprovada') aprov++;
        if (o.status === 'Recusada') recus++;
      });
      document.getElementById('r-pend').textContent = pend;
      document.getElementById('r-aprov').textContent = aprov;
      document.getElementById('r-recus').textContent = recus;

      var texto = document.getElementById('busca').value.trim().toLowerCase();
      var status = document.getElementById('filtro-status').value;
      var linhas = ongs.filter(function (o) {
        return (o.nome + ' ' + o.cnpj).toLowerCase().indexOf(texto) !== -1 && (status === 'todos' || o.status === status);
      }).map(function (o) {
        return '<tr><td><strong>' + o.nome + '</strong></td><td>' + o.cnpj + '</td><td>' + o.email + '</td><td>' + o.cadastro +
          '</td><td><span class="' + classeStatus(o.status) + '">' + o.status + '</span></td>' +
          '<td><button class="botao-mini" data-analisar="' + o.id + '">Analisar</button></td></tr>';
      });
      document.getElementById('tabela').innerHTML = linhas.length
        ? linhas.join('')
        : '<tr><td colspan="6" class="vazio">[ nenhuma ONG encontrada ]</td></tr>';
    }

    function atualizar(id, status, motivo) {
      var o = ongs.find(function (x) { return x.id === id; });
      o.status = status;
      o.motivo = motivo || '';
      salvarEstado('bemvida_ongs_admin', ongs);
      desenhar();
    }

    // Abre o painel de análise com os dados da ONG
    document.getElementById('tabela').addEventListener('click', function (e) {
      var id = e.target.getAttribute('data-analisar');
      if (!id) return;
      ongAberta = ongs.find(function (o) { return o.id === Number(id); });
      var o = ongAberta;
      document.getElementById('d-nome').textContent = o.nome;
      document.getElementById('d-dados').innerHTML =
        '<dt>CNPJ</dt><dd>' + o.cnpj + '</dd><dt>Área de atuação</dt><dd>' + o.area + '</dd>' +
        '<dt>E-mail</dt><dd>' + o.email + '</dd><dt>Telefone</dt><dd>' + o.telefone + '</dd>' +
        '<dt>Endereço</dt><dd>' + o.endereco + '</dd><dt>Descrição</dt><dd>' + o.descricao + '</dd>' +
        '<dt>Status</dt><dd><span class="' + classeStatus(o.status) + '">' + o.status + '</span></dd>';
      document.getElementById('d-docs').innerHTML = ONG_DOCUMENTOS.map(function (d) {
        return '<div class="item">' + d + ' <button type="button" class="botao-mini" data-doc="1">Visualizar</button></div>';
      }).join('');
      document.getElementById('d-motivo').textContent = o.motivo ? 'Motivo da decisão: ' + o.motivo : '';
      var pendente = o.status === 'Pendente';
      document.getElementById('d-aprovar').style.display = pendente ? '' : 'none';
      document.getElementById('d-recusar').style.display = pendente ? '' : 'none';
      modalDetalhe.showModal();
    });

    document.getElementById('d-docs').addEventListener('click', function (e) {
      if (e.target.getAttribute('data-doc')) mostrarAviso('Visualização de documentos disponível no sistema final.');
    });
    document.getElementById('d-fechar').addEventListener('click', function () { modalDetalhe.close(); });

    document.getElementById('d-aprovar').addEventListener('click', function () {
      atualizar(ongAberta.id, 'Aprovada');
      modalDetalhe.close();
      mostrarAviso('ONG aprovada.');
    });
    document.getElementById('d-recusar').addEventListener('click', function () {
      modalDetalhe.close();
      pedirMotivo('Recusar ONG', 'Informe por que o cadastro de "' + ongAberta.nome + '" foi recusado.', 'Confirmar recusa', function (motivo) {
        atualizar(ongAberta.id, 'Recusada', motivo);
        mostrarAviso('ONG recusada.');
      });
    });

    document.getElementById('busca').addEventListener('input', desenhar);
    document.getElementById('filtro-status').addEventListener('change', desenhar);
    desenhar();
  </script>

</body>
</html>
