<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cestas para famílias | BemVida+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho-publico">
    <a href="index.html" class="logo"><img src="img/logo.png" alt="BemVida+"> BemVida+</a>
    <nav class="nav-publica">
      <a href="index.html">Início</a>
      <a href="quem-somos.html">Quem Somos</a>
      <a href="campanhas.html" class="ativo">Campanhas</a>
    </nav>
    <div class="acoes-cabecalho">
      <a href="login.html" class="botao botao-secundario">Login</a>
      <a href="cadastro.html" class="botao botao-escuro">Cadastro</a>
    </div>
  </header>

  <section class="secao">
    <div class="container">

      <div id="capa-campanha" style="margin-bottom:32px;"></div>

      <div class="duas-colunas" style="display:grid; grid-template-columns: 2fr 1fr; gap:40px; align-items:start;">

        <!-- Coluna principal -->
        <div>
          <span class="eyebrow" id="categoria"></span>
          <h1 style="font-size:1.7rem;" id="titulo"></h1>
          <p id="descricao"></p>
          <hr>

          <span class="eyebrow">ITENS NECESSÁRIOS</span>
          <div style="margin-bottom:24px;" id="itens"></div>

          <div class="card" style="padding:20px;">
            <span class="eyebrow">ONG RESPONSÁVEL</span>
            <strong id="ong"></strong>
            <p style="margin-top:6px;">ONG validada pela administração da plataforma.</p>
          </div>
        </div>

        <!-- Coluna lateral: progresso -->
        <div class="card" style="padding:20px;">
          <span class="eyebrow">PROGRESSO DA CAMPANHA</span>
          <div class="barra-progresso" style="margin-top:8px;"><span id="barra"></span></div>
          <div class="progresso-texto">
            <span id="texto-progresso"></span>
            <span id="pct"></span>
          </div>
          <p style="font-size:0.82rem; margin:12px 0 16px;">Os números representam itens físicos confirmados pela ONG.</p>
          <a href="registrar-intencao.html" id="botao-doar" class="botao botao-escuro" style="width:100%; display:block;">Quero Doar</a>
        </div>

      </div>
    </div>
  </section>

  <footer class="rodape">
    [ links institucionais · contato · termos ]
  </footer>

  <script src="js/dados.js"></script>
  <script>
    // A página lê o número da campanha na URL (?id=3). Sem id, mostra a primeira.
    var id = new URLSearchParams(window.location.search).get('id') || 1;
    var c = acharCampanha(id) || CAMPANHAS[0];

    document.title = c.titulo + ' | BemVida+';
    document.getElementById('capa-campanha').innerHTML = htmlCapa(c, '');
    document.querySelector('#capa-campanha .capa').style.height = '320px';
    document.getElementById('categoria').textContent = NOMES_CATEGORIA[c.categoria].toUpperCase();
    document.getElementById('titulo').textContent = c.titulo;
    document.getElementById('descricao').textContent = c.descricao;
    document.getElementById('ong').textContent = c.ong;
    document.getElementById('barra').style.width = percentual(c) + '%';
    document.getElementById('pct').textContent = percentual(c) + '%';
    document.getElementById('texto-progresso').textContent = c.recebidos + ' de ' + c.meta + ' itens recebidos';
    document.getElementById('botao-doar').href = 'registrar-intencao.html?id=' + c.id;
    document.getElementById('itens').innerHTML =
      c.itens.map(function (i) { return '<span class="tag">' + i + '</span>'; }).join('');
  </script>

</body>
</html>
